<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Landing Page</title>
<link rel="icon" href="head.png">
<style>
body {
    margin: 0;
    padding: 0;
    background-color: #d3d3d3;
    font-family: sans-serif;
    display: flex;
    flex-direction: column;      /* stack items vertically */
    justify-content: center;
    align-items: center;
    text-align: center;          /* center the paragraph text */
    height: 100vh;
    overflow: hidden;
    cursor: pointer;
}
img {
    width: 60vw;
    height: auto;
    display: block;
    pointer-events: none;
}
p {
    margin: 0.5em 0;             /* tighten up spacing since br's aren't needed */
}
.footer-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 8vh;
    background-color: rgba(255, 255, 255, 0.3);
    backdrop-filter: blur(10px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    color: #333;
}
.song-title {
    font-size: 2.5vw;
    white-space: nowrap;
    text-transform: lowercase;
    letter-spacing: 0.1em;
}
</style>
</head>
<body>

<img src="landingimage2.jpg" alt="Landing Image">

<audio id="bgMusic" loop>
<source src="stuck in a car with angels [-GEjqO8J234].mp3" type="audio/mpeg">
</audio>

<script>
const audio = document.getElementById('bgMusic');
audio.volume = 0.2;

window.addEventListener('click', () => {
    if (audio.paused) {
        audio.play();
    } else {
        audio.pause();
    }
});
</script>

</body>
</html>
